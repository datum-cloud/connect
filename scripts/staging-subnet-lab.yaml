apiVersion: compute.datumapis.com/v1alpha
kind: Workload
metadata:
  name: connect-subnet-lab-origin
  labels:
    connect.datum.net/lab: subnet-20261002
spec:
  placements:
    - name: dfw
      locationSelector:
        matchLabels: {topology.datum.net/city-code: DFW}
      scaleSettings: {minReplicas: 1}
  template:
    metadata:
      labels: {connect.datum.net/lab: subnet-20261002}
    spec:
      networkInterfaces:
        - name: eth0
          network: {name: connect-subnet-lab-vpc}
          ipFamilies: [IPv6]
      runtime:
        class: general-purpose
        resources: {instanceType: datumcloud/d1-standard-2}
        sandbox:
          containers:
            - name: lab
              image: docker.io/library/ubuntu:24.04
              command: [/bin/bash, -ec]
              args:
                - apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y iproute2 curl ca-certificates python3 && mkdir -p /lab && touch /lab/ready && exec sleep infinity
              securityContext:
                capabilities:
                  add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
