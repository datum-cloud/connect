<text x="780" y="410" class="detail" text-anchor="middle">Dependent systems</text>
<rect x="50" y="305" width="330" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="215" y="337" class="heading" text-anchor="middle">Endpoint lifecycle</text>
<text x="215" y="370" class="label" text-anchor="middle">Reservations, cell assignments,</text>
<text x="215" y="396" class="detail" text-anchor="middle">grant pins, readiness, cleanup</text>
<rect x="50" y="440" width="330" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="215" y="474" class="heading" text-anchor="middle">TLSCertificate</text>
<text x="215" y="504" class="detail" text-anchor="middle">Gateway hostname requests</text>
