<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1420" viewBox="0 0 960 1420" role="img" aria-labelledby="title description">
<title id="title">Project resources and dependent systems</title>
<desc id="description">The customer project holds gateway intent. The Connect service-provider project holds endpoint records, TLSCertificate requests, DNSZone and DNSRecordSet resources. Certificates and DNS reconcile these project resources from outside the project. Issued keys remain in Certificates infrastructure and are delivered through Karmada to the separate cell control plane.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; } .heading { font-size: 21px; font-weight: 700; } .label { font-size: 18px; } .detail { font-size: 17px; fill: #475569; } .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }</style>


<rect width="960" height="1420" fill="white"/>
<rect x="50" y="30" width="330" height="120" rx="10" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
