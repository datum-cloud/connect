<text x="780" y="1085" class="heading" text-anchor="middle">Shared connection</text>
<text x="780" y="1114" class="detail" text-anchor="middle">H3 QUIC or H2 TLS/TCP</text>
<path d="M 780 890 L 780 1050" class="line"/>
<text x="790" y="955" class="detail">Two streams</text>
<path d="M 650 1095 L 380 1095" class="line"/>
<rect x="430" y="1250" width="220" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="540" y="1284" class="heading" text-anchor="middle">VPC A</text>
<text x="540" y="1314" class="detail" text-anchor="middle">Grant A, routes A</text>
<rect x="700" y="1250" width="220" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="810" y="1284" class="heading" text-anchor="middle">VPC B</text>
