<text x="215" y="622" class="label" text-anchor="middle">Managed Connect zone</text>
<text x="215" y="649" class="detail" text-anchor="middle">Routing and challenge CNAMEs</text>
<text x="215" y="699" class="detail" text-anchor="middle">Project resources, not private keys</text>
