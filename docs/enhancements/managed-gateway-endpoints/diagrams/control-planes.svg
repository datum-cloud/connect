<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1010" viewBox="0 0 960 1010" role="img" aria-labelledby="title description">
<title id="title">Managed gateway systems and control planes</title>
<desc id="description">Customer project intent goes to the Connect service-provider Project control plane. It owns reservations, endpoint assignments, requests, and cleanup records. Connect uses Certificates for issuance and DNS for routing and validation records. Karmada delivers the certificate and registration to Galactic in the selected cell and returns applied status. The selected cell control plane is a separate boundary outside the customer and Connect service-provider Project control planes. Certificates, DNS, and Karmada are separate dependent systems. Karmada delivery and applied status cross that boundary.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; } .heading { font-size: 21px; font-weight: 700; } .label { font-size: 18px; } .detail { font-size: 17px; fill: #475569; } .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }</style>

<rect width="960" height="1010" fill="white"/>
<rect x="50" y="30" width="330" height="120" rx="10" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="215" y="59" class="heading" text-anchor="middle">Customer Project</text>
<text x="215" y="83" class="heading" text-anchor="middle">control plane</text>
<text x="215" y="109" class="label" text-anchor="middle">Gateway, network, and policy</text>
<text x="215" y="132" class="detail" text-anchor="middle">User intent and endpoint status</text>
<rect x="20" y="225" width="400" height="330" rx="10" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="220" y="260" class="heading" text-anchor="middle">Connect service-provider</text>
<text x="220" y="285" class="heading" text-anchor="middle">Project control plane</text>
<text x="780" y="260" class="detail" text-anchor="middle">Dependent systems</text>
<rect x="50" y="305" width="330" height="185" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="215" y="334" class="heading" text-anchor="middle">Endpoint lifecycle</text>
<text x="215" y="375" class="label" text-anchor="middle">Reserve hostname and metro</text>
<text x="215" y="405" class="label" text-anchor="middle">Choose serving cell</text>
<text x="215" y="435" class="label" text-anchor="middle">Track readiness and cleanup</text>
<text x="215" y="467" class="detail" text-anchor="middle">Service-owned records</text>
<rect x="650" y="290" width="260" height="80" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="780" y="324" class="heading" text-anchor="middle">Certificates</text>
<text x="780" y="351" class="detail" text-anchor="middle">Public certificate lifecycle</text>
<rect x="650" y="410" width="260" height="80" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="780" y="444" class="heading" text-anchor="middle">DNS</text>
<text x="780" y="471" class="detail" text-anchor="middle">Routing and validation records</text>
<rect x="50" y="610" width="330" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="215" y="645" class="heading" text-anchor="middle">Karmada</text>
<text x="215" y="675" class="detail" text-anchor="middle">Selected-cell distribution</text>
<rect x="20" y="830" width="920" height="160" rx="10" fill="#f0fdf4" stroke="#96bda1" stroke-width="1.5"/>
<text x="910" y="865" class="heading" text-anchor="end">Selected cell control plane</text>
<rect x="50" y="880" width="330" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="215" y="915" class="heading" text-anchor="middle">Galactic</text>
<text x="215" y="944" class="detail" text-anchor="middle">MASQUE access to the VPC</text>
<path d="M 215 150 L 215 225" class="line"/>
<text x="235" y="192" class="detail" text-anchor="start">Resolve intent</text>
<path d="M 380 330 L 650 330" class="line" marker-start="url(#arrow)"/>
<text x="535" y="315" class="detail" text-anchor="middle">Request / issued certificate</text>
<path d="M 380 450 L 650 450" class="line"/>
<text x="515" y="435" class="detail" text-anchor="middle">Publish DNS records</text>
<path d="M 215 490 L 215 610" class="line" marker-start="url(#arrow)"/>
<text x="235" y="536" class="detail" text-anchor="start">Certificate + registration</text>
<text x="235" y="585" class="detail" text-anchor="start">Applied status returns</text>
<path d="M 215 700 L 215 880" class="line" marker-start="url(#arrow)"/>
<text x="235" y="780" class="detail" text-anchor="start">Deliver / report applied</text>
</svg>
