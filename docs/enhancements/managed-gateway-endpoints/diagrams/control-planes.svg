<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title description">
<title id="title">Managed gateway control planes</title><desc id="description">Connect translates project intent into a metro endpoint. Central services manage DNS and certificates. Karmada delivers the certificate and registration to the selected cell. Clients connect directly to existing Galactic MASQUE listeners.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; } .heading { font-size: 21px; font-weight: 700; } .label { font-size: 18px; } .detail { font-size: 17px; fill: #475569; } .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }</style>
<rect width="960" height="720" fill="white"/>
<rect x="20" y="20" width="920" height="125" rx="10" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="44" y="53" class="heading" text-anchor="start">Project control plane</text>
<text x="480" y="88" class="label" text-anchor="middle">ConnectGateway • Network • Connection policy • Bindings</text>
<text x="480" y="117" class="detail" text-anchor="middle">User intent and endpoint status</text>
<rect x="20" y="195" width="920" height="230" rx="10" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="44" y="229" class="heading" text-anchor="start">Service and infrastructure control planes</text>
<rect x="45" y="255" width="280" height="95" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="185" y="285" class="heading" text-anchor="middle">Connect controller</text>
<text x="185" y="313" class="label" text-anchor="middle">Hostname + metro reservation</text>
<text x="185" y="337" class="detail" text-anchor="middle">Selected cell + progress</text>
<rect x="430" y="255" width="270" height="95" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="565" y="285" class="heading" text-anchor="middle">Certificate service</text>
<text x="565" y="313" class="label" text-anchor="middle">Central cert-manager</text>
<text x="565" y="337" class="detail" text-anchor="middle">Issued TLS Secret</text>
<rect x="745" y="255" width="170" height="95" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="830" y="285" class="heading" text-anchor="middle">DNS operator</text>
<text x="830" y="313" class="label" text-anchor="middle">Routing and</text>
<text x="830" y="337" class="detail" text-anchor="middle">validation records</text>
<path d="M 185 145 L 185 195" class="line"/>
<text x="202" y="178" class="detail" text-anchor="start">resolve intent</text>
<path d="M 325 292 L 430 292" class="line"/>
<text x="377" y="278" class="detail" text-anchor="middle">request</text>
<path d="M 325 335 L 365 335 L 365 390 L 830 390 L 830 350" class="line"/>
<text x="588" y="381" class="detail" text-anchor="middle">publish required DNS records</text>
<rect x="20" y="475" width="920" height="225" rx="10" fill="#f0fdf4" stroke="#96bda1" stroke-width="1.5"/>
<text x="44" y="510" class="heading" text-anchor="start">Selected cell • existing Galactic capacity</text>
<rect x="45" y="545" width="400" height="115" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="245" y="578" class="heading" text-anchor="middle">Shared MASQUE listeners</text>
<text x="245" y="607" class="label" text-anchor="middle">Hostname + certificate + gateway scope</text>
<text x="245" y="636" class="detail" text-anchor="middle">HTTP/3 UDP 443 • HTTP/2 TCP 443</text>
<rect x="570" y="545" width="345" height="115" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="742" y="578" class="heading" text-anchor="middle">Grant authority + Edge</text>
<text x="742" y="607" class="label" text-anchor="middle">Authorize and attach to the VPC</text>
<text x="742" y="636" class="detail" text-anchor="middle">Cell-scoped grants and routes</text>
<path d="M 565 350 L 565 451 L 245 451 L 245 475" class="line"/>
<text x="580" y="439" class="detail" text-anchor="start">Karmada: Secret + registration</text>
<path d="M 445 602 L 570 602" class="line"/>
<text x="507" y="588" class="detail" text-anchor="middle">admit</text>
<path d="M 80 475 L 80 425" class="line" stroke-dasharray="5 4"/>
<text x="95" y="462" class="detail" text-anchor="start">applied status</text>
</svg>
