<path d="M 360 188 L 360 222"/>
<path d="M 360 248 L 360 282"/>
<path d="M 360 308 L 360 310"/>
<path d="M 360 320 L 360 343"/>
<path d="M 360 395 L 360 402"/>
<path d="M 360 428 L 360 462"/>
<path d="M 360 488 L 360 490"/>
<path d="M 360 500 L 360 522"/>
<path d="M 360 548 L 360 550"/>
<path d="M 360 560 L 360 582"/>
<path d="M 360 608 L 360 610"/>
<path d="M 360 620 L 360 642"/>
<path d="M 360 668 L 360 670"/>
<path d="M 360 680 L 360 705"/>
<path d="M 600 85 L 600 343"/>
<path d="M 600 395 L 600 462"/>
<path d="M 600 488 L 600 490"/>
<path d="M 600 500 L 600 522"/>
<path d="M 600 548 L 600 550"/>
<path d="M 600 560 L 600 642"/>
<path d="M 600 668 L 600 670"/>
<path d="M 600 680 L 600 705"/>
<path d="M 840 85 L 840 705"/>
</g>
<rect x="15" y="20" width="210" height="65" rx="10" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="120" y="47" class="heading" text-anchor="middle">Connect</text>
<text x="120" y="70" class="detail" text-anchor="middle">Service-provider project</text>
<rect x="255" y="20" width="210" height="65" rx="10" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="360" y="47" class="heading" text-anchor="middle">Certificates</text>
<text x="360" y="70" class="detail" text-anchor="middle">Central issuance</text>
<rect x="495" y="20" width="210" height="65" rx="10" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="600" y="47" class="heading" text-anchor="middle">DNS</text>
<text x="600" y="70" class="detail" text-anchor="middle">Managed zone</text>
<rect x="735" y="20" width="210" height="65" rx="10" fill="#f0fdf4" stroke="#96bda1" stroke-width="1.5"/>
<text x="840" y="47" class="heading" text-anchor="middle">Galactic</text>
<text x="840" y="70" class="detail" text-anchor="middle">Cell control plane</text>
<rect x="10" y="103" width="290" height="48" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="155" y="133" class="label" text-anchor="middle">Save endpoint in service project</text>
<text x="240.0" y="183" class="label" text-anchor="middle">Reconcile TLSCertificate</text>
<path d="M 120 195 L 360 195" class="line"/>
<text x="240.0" y="243" class="label" text-anchor="middle">Required challenge CNAME</text>
<path d="M 360 255 L 120 255" class="line" stroke-dasharray="5 4"/>
<text x="360.0" y="303" class="label" text-anchor="middle">Reconcile challenge DNSRecordSet</text>
<path d="M 120 315 L 600 315" class="line"/>
<rect x="285" y="345" width="390" height="48" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="480" y="375" class="label" text-anchor="middle">Validate DNS; complete ACME issuance</text>
<text x="240.0" y="423" class="label" text-anchor="middle">Ready status; key stays in Certificates</text>
<path d="M 360 435 L 120 435" class="line" stroke-dasharray="5 4"/>
<text x="480.0" y="483" class="label" text-anchor="middle">Deliver registration + service-held TLS Secret through Karmada</text>
<path d="M 120 495 L 840 495" class="line"/>
<text x="480.0" y="543" class="label" text-anchor="middle">Acknowledge applied endpoint and certificate versions</text>
<path d="M 840 555 L 120 555" class="line" stroke-dasharray="5 4"/>
<text x="360.0" y="603" class="label" text-anchor="middle">Reconcile routing DNSRecordSet</text>
<path d="M 120 615 L 600 615" class="line"/>
<text x="480.0" y="663" class="label" text-anchor="middle">External TLS, transport, and VPC packet checks</text>
<path d="M 120 675 L 840 675" class="line"/>
<rect x="28" y="722" width="904" height="56" rx="10" fill="#f0fdf4" stroke="#96bda1" stroke-width="1.5"/>
<text x="480" y="756" class="label" text-anchor="middle">Mark ready; broker returns this endpoint with an authorized cell-specific grant</text>
</svg>
