<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img" aria-labelledby="title description">
<title id="title">Endpoint provisioning sequence</title><desc id="description">Connect reserves a hostname, requests DNS-01 issuance, publishes the required challenge CNAME, delivers the resulting certificate and registration, waits for listener application, then publishes routing DNS and verifies external connectivity before enabling the broker.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; } .heading { font-size: 21px; font-weight: 700; } .label { font-size: 18px; } .detail { font-size: 17px; fill: #475569; } .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }</style>
<rect width="960" height="800" fill="white"/>
<rect x="15" y="20" width="210" height="65" rx="10" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="120" y="47" class="heading" text-anchor="middle">Connect</text>
<text x="120" y="70" class="detail" text-anchor="middle">Endpoint controller</text>
<path d="M 120 85 L 120 700" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="255" y="20" width="210" height="65" rx="10" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="360" y="47" class="heading" text-anchor="middle">Certificates</text>
<text x="360" y="70" class="detail" text-anchor="middle">Central issuance</text>
<path d="M 360 85 L 360 700" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="495" y="20" width="210" height="65" rx="10" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="600" y="47" class="heading" text-anchor="middle">DNS</text>
<text x="600" y="70" class="detail" text-anchor="middle">Managed zone</text>
<path d="M 600 85 L 600 700" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="735" y="20" width="210" height="65" rx="10" fill="#eff6ff" stroke="#93b4df" stroke-width="1.5"/>
<text x="840" y="47" class="heading" text-anchor="middle">Galactic</text>
<text x="840" y="70" class="detail" text-anchor="middle">Selected cell</text>
<path d="M 840 85 L 840 700" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="25" y="103" width="245" height="48" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="147" y="133" class="label" text-anchor="middle">Reserve hostname and cell</text>
<text x="240.0" y="183" class="label" text-anchor="middle">Request DNS-01 certificate</text>
<path d="M 120 195 L 360 195" class="line"/>
<text x="240.0" y="243" class="label" text-anchor="middle">Required challenge CNAME</text>
<path d="M 360 255 L 120 255" class="line" stroke-dasharray="5 4"/>
<text x="360.0" y="303" class="label" text-anchor="middle">Publish exact challenge CNAME</text>
<path d="M 120 315 L 600 315" class="line"/>
<rect x="285" y="345" width="390" height="48" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="480" y="375" class="label" text-anchor="middle">Validate DNS; complete ACME issuance</text>
<text x="240.0" y="423" class="label" text-anchor="middle">Ready certificate + stored Secret</text>
<path d="M 360 435 L 120 435" class="line" stroke-dasharray="5 4"/>
<text x="480.0" y="483" class="label" text-anchor="middle">Deliver TLS Secret + registration through Karmada</text>
<path d="M 120 495 L 840 495" class="line"/>
<text x="480.0" y="543" class="label" text-anchor="middle">Acknowledge applied endpoint and certificate versions</text>
<path d="M 840 555 L 120 555" class="line" stroke-dasharray="5 4"/>
<text x="360.0" y="603" class="label" text-anchor="middle">Publish routing DNS to selected cell</text>
<path d="M 120 615 L 600 615" class="line"/>
<text x="480.0" y="663" class="label" text-anchor="middle">External TLS, transport, and VPC packet checks</text>
<path d="M 120 675 L 840 675" class="line"/>
<rect x="28" y="722" width="904" height="56" rx="10" fill="#f0fdf4" stroke="#96bda1" stroke-width="1.5"/>
<text x="480" y="756" class="label" text-anchor="middle">Mark ready; broker returns this endpoint with an authorized cell-specific grant</text>
</svg>
