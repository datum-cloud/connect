[package]
name = "connect-lib"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Gate integration-style tests that require rustls CryptoProvider
# (ring or aws-lc-rs feature) and external token helpers.
# Run with: cargo test --lib --features integration-tests
integration-tests = []

[dependencies]
arc-swap = { workspace = true, features = ["serde"] }
base64 = { workspace = true }
chrono = { workspace = true }
derive_more = { workspace = true }
fs2 = { workspace = true }
gethostname = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
k8s-openapi = { workspace = true }
kube = { workspace = true }
n0-error = { workspace = true }
n0-future = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
rsa = { version = "0.9", features = ["pem", "sha2"] }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

# iroh dependencies
iroh = { workspace = true }
iroh-base = { workspace = true }
iroh-relay = { workspace = true }
iroh-tickets = { workspace = true }
iroh-proxy-utils = { workspace = true }

# postcard for ticket serialization
postcard = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
