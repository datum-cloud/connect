[package]
name = "connect-lib"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
default = []
# Gate integration-style tests that require rustls CryptoProvider
# (ring or aws-lc-rs feature) and external token helpers.
# Run with: cargo test --lib --features integration-tests
integration-tests = []

[dependencies]
arc-swap = { workspace = true, features = ["serde"] }
base64 = { workspace = true }
chrono = { workspace = true }
derive_more = { workspace = true }
gethostname = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
k8s-openapi = { workspace = true }
kube = { workspace = true }
n0-error = { workspace = true }
n0-future = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
# Provides the CryptoProvider every iroh Endpoint::builder(..) must be given
# explicitly as of iroh 1.x (Builder::bind() errors with
# BindError::InvalidCryptoProvider if none is set) — same crate + feature
# bin/ installs process-wide via install_default() for rustls generally.
rustls = { version = "0.23", features = ["ring"] }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

# iroh dependencies
iroh = { version = "1", default-features = false }
iroh-base = { version = "1" }
iroh-relay = { version = "1" }
iroh-tickets = "1"
iroh-services = "1.0.0"
iroh-proxy-utils = { git = "https://github.com/n0-computer/iroh-proxy-utils", rev = "e87788bb49d9" }

# postcard for ticket serialization
postcard = "1"
tun = { version = "0.8.14", features = ["async"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
