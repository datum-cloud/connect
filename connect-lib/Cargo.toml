[workspace]
members = ["lib", "bin", "transport", "daemon", "ip-adapter", "network-helper", "masque-interop-lab"]
resolver = "2"

[workspace.package]
rust-version = "1.98"

[workspace.lints.rust]
warnings = "deny"

[workspace.dependencies]
arc-swap = "1.8.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
derive_more = { version = "2.1.1", features = ["display"] }
fs2 = "0.4.3"
gethostname = "1.1.0"
hex = "0.4.3"
http = "1"
h3 = { version = "0.0.8", features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-datagram = "0.0.2"
futures-util = "0.3"
bytes = "1"
k8s-openapi = { version = "0.26.1", features = ["v1_30"] }
kube = { version = "2.0.1", default-features = false, features = ["client", "derive", "rustls-tls"] }
n0-error = { version = "1.0", features = ["anyhow"] }
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "http-proto", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace"] }
n0-future = "0.3"
rand = "0.9"
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
serde_yml = "0.0.12"
thiserror = "2"
tokio = { version = "1.34.0", features = ["full"] }
tokio-util = "0.7.10"
tracing = "0.1.40"
tracing-opentelemetry = "0.32"
url = "2"
iroh = { version = "~1.0.0", default-features = false, features = ["tls-ring"] }
iroh-base = "~1.0.0"
iroh-relay = "~1.0.0"
iroh-tickets = "~1.0.0"
iroh-proxy-utils = "0.3"

[patch.crates-io]
# h3 0.0.8 predates CONNECT-IP support; drop this pin after hyperium/h3#273 is released.
h3 = { git = "https://github.com/hyperium/h3", rev = "0e54a16df76102809ad99b03663b559dfc203917" }
h3-datagram = { path = "transport/vendor/h3-datagram" }
