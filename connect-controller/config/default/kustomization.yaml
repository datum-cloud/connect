apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: connect-system
resources:
- namespace.yaml
- milo-configuration-certificate.yaml
- ../base/crd
- ../base/rbac
- ../base/manager

configMapGenerator:
- name: connect-project-kubeconfigs
  files:
  - milo-kubeconfig.yaml
  options:
    disableNameSuffixHash: true
