apiVersion: v1
clusters:
- cluster:
    certificate-authority: /etc/kubernetes/pki/trust/ca.crt
    server: https://milo-apiserver.datum-system.svc.cluster.local:6443
  name: milo
contexts:
- context:
    cluster: milo
    user: connect-controller
  name: connect-controller
current-context: connect-controller
kind: Config
preferences: {}
users:
- name: connect-controller
  user:
    client-certificate: /etc/kubernetes/projects/pki/client/tls.crt
    client-key: /etc/kubernetes/projects/pki/client/tls.key
