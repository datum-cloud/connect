apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../default
images:
- name: ghcr.io/datum-cloud/connect-controller
  newName: connect-controller
  newTag: dev
patches:
- target:
    kind: Deployment
    name: connect-controller
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
