apiVersion: iam.miloapis.com/v1alpha1
kind: Role
metadata:
  name: connect-gateway-staging-test
  namespace: milo-system
  annotations:
    kubernetes.io/display-name: Connect Gateway Staging Test
    kubernetes.io/description: Temporary least-privilege access to create and inspect a staging ConnectGateway.
spec:
  launchStage: Beta
  includedPermissions:
  - connect.datumapis.com/connectgateways.create
  - connect.datumapis.com/connectgateways.delete
  - connect.datumapis.com/connectgateways.get
  - connect.datumapis.com/connectgateways.list
  - connect.datumapis.com/connectgateways.watch
