---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: connect-manager
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - compute.datumapis.com
  resources:
  - workloads
  verbs:
  - create
  - delete
  - get
  - patch
  - update
- apiGroups:
  - connect.datumapis.com
  resources:
  - connectconnectionpolicies
  - connectgatewayclasses
  - connectgatewayplacements
  - connectgateways
  - connectnetworkbindings
  - connectoradvertisements
  - connectorclasses
  - connectors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - connect.datumapis.com
  resources:
  - connectconnectionpolicies/status
  - connectgatewayclasses/status
  - connectgatewayplacements/status
  - connectgateways/status
  - connectnetworkbindings/status
