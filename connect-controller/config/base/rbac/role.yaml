  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - locations.miloapis.com
  resources:
  - locations
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.datumapis.com
  resources:
  - networks
  verbs:
  - get
  - list
  - watch
