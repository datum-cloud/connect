apiVersion: apps/v1
kind: Deployment
metadata:
  name: connect-controller
  labels:
    app.kubernetes.io/name: connect-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: connect-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: connect-controller
    spec:
      serviceAccountName: connect-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: ghcr.io/datum-cloud/connect-controller:latest
        imagePullPolicy: IfNotPresent
        args:
        - --internal-service-discovery=$(INTERNAL_SERVICE_DISCOVERY)
        env:
        - name: INTERNAL_SERVICE_DISCOVERY
          valueFrom:
            configMapKeyRef:
              name: connect-controller-config
              key: INTERNAL_SERVICE_DISCOVERY
        ports:
        - name: metrics
          containerPort: 8080
        - name: probes
          containerPort: 8081
        livenessProbe:
          httpGet: {path: /healthz, port: probes}
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet: {path: /readyz, port: probes}
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
