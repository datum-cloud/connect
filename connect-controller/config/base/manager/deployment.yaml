apiVersion: apps/v1
kind: Deployment
metadata:
  name: connect-controller
  labels:
    app.kubernetes.io/name: connect-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: connect-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: connect-controller
    spec:
      serviceAccountName: connect-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: ghcr.io/datum-cloud/connect-controller:latest
        imagePullPolicy: IfNotPresent
        args:
        - --internal-service-discovery=$(INTERNAL_SERVICE_DISCOVERY)
        - --discovery-kubeconfig=/etc/kubernetes/projects/auth/milo-kubeconfig.yaml
        - --project-kubeconfig=/etc/kubernetes/projects/auth/milo-kubeconfig.yaml
        - --identity-project=$(IDENTITY_PROJECT)
        env:
        - name: INTERNAL_SERVICE_DISCOVERY
          valueFrom:
            configMapKeyRef:
              name: connect-controller-config
              key: INTERNAL_SERVICE_DISCOVERY
        - name: IDENTITY_PROJECT
          valueFrom:
            configMapKeyRef:
              name: connect-controller-config
              key: IDENTITY_PROJECT
        ports:
        - name: metrics
          containerPort: 8080
        - name: probes
          containerPort: 8081
        livenessProbe:
          httpGet: {path: /healthz, port: probes}
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet: {path: /readyz, port: probes}
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 1, memory: 1Gi}
        volumeMounts:
        - name: milo-kubeconfig
          mountPath: /etc/kubernetes/projects/auth
          readOnly: true
        - name: milo-client-certificate
          mountPath: /etc/kubernetes/projects/pki/client
          readOnly: true
        - name: milo-trust-bundle
          mountPath: /etc/kubernetes/pki/trust
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: milo-kubeconfig
        configMap:
          name: connect-project-kubeconfigs
      - name: milo-client-certificate
        csi:
          driver: csi.cert-manager.io
          readOnly: true
          volumeAttributes:
            csi.cert-manager.io/common-name: system:control@connect.datumapis.com
            csi.cert-manager.io/fs-group: "65532"
            csi.cert-manager.io/issuer-kind: ClusterIssuer
            csi.cert-manager.io/issuer-name: datum-control-plane
            csi.cert-manager.io/key-usages: client auth
            csi.cert-manager.io/organizations: system:masters,system:datum-cloud
      - name: milo-trust-bundle
        configMap:
          name: datum-control-plane-trust-bundle
