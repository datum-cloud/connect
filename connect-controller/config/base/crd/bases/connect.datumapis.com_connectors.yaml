---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    discovery.miloapis.com/parent-contexts: Project
  name: connectors.connect.datumapis.com
spec:
  group: connect.datumapis.com
  names:
    kind: Connector
    listKind: ConnectorList
    plural: connectors
    singular: connector
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.classRef
      name: Class
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Connector represents one Connect installation in one project. Its transport
          and control-plane authentication public keys are distinct immutable
          identities. Private material must never be stored in the API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              authentication:
                properties:
                  publicKey:
                    description: |-
                      PublicKey is a PEM-encoded RSA public key. The matching private key remains
                      on the Connector and signs OAuth JWT assertions.
                    maxLength: 8192
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: publicKey is the immutable control-plane authentication
                        identity; replace the Connector to rotate it
                      rule: oldSelf == null || self == oldSelf
                required:
                - publicKey
                type: object
              classRef:
                description: ClassRef names a cluster-scoped ConnectorClass in the
                  management cluster.
                type: string
              transport:
                properties:
                  publicKey:
                    description: PublicKey is the lowercase or uppercase hex-encoded
                      32-byte iroh public key.
                    pattern: ^[a-fA-F0-9]{64}$
                    type: string
                    x-kubernetes-validations:
                    - message: publicKey is the immutable iroh transport identity;
                        replace the Connector to rotate it
                      rule: oldSelf == null || self == oldSelf
                required:
                - publicKey
                type: object
            required:
            - authentication
            - classRef
            - transport
            type: object
          status:
            properties:
              assignedAddresses:
                items:
                  type: string
                type: array
              authentication:
                description: |-
                  Authentication identifies the platform principal bound to this immutable
                  Connector UID and the provider key IDs available for JWT assertions.
                properties:
                  authProviderKeyID:
                    type: string
                  connectorUID:
                    type: string
                  principalRef:
                    properties:
                      clientEmail:
                        type: string
                      clientID:
                        type: string
                      name:
                        type: string
                      project:
                        type: string
                      uid:
                        type: string
                    required:
                    - name
                    - project
                    type: object
                  serviceAccountKeyRef:
                    type: string
                required:
                - connectorUID
                - principalRef
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              leaseRef:
                type: string
              observedGeneration:
                format: int64
                type: integer
              transport:
                description: |-
                  Transport is Connector-reported observed reachability. The controller
                  preserves it and does not interpret these URLs as user-selected policy.
                properties:
                  endpoint:
                    description: |-
                      Endpoint is the Connector's serialized iroh EndpointAddr observation.
                      It is written by the Connector agent, not by users or the controller.
                    maxLength: 16384
                    type: string
                  relayURLs:
                    description: |-
                      RelayURLs are the relay addresses actually used by the Connector. They are
                      observed status, not a user-selectable relay policy.
                    items:
                      maxLength: 2048
                      type: string
                    maxItems: 8
                    type: array
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
