---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    discovery.miloapis.com/parent-contexts: Project
  name: connectorenrollments.connect.datumapis.com
spec:
  group: connect.datumapis.com
  names:
    kind: ConnectorEnrollment
    listKind: ConnectorEnrollmentList
    plural: connectorenrollments
    singular: connectorenrollment
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ConnectorEnrollment is the protected bootstrap interface for a Connector's
          platform-owned identity. Grant create permission independently from ordinary
          Connector update permission. Its spec is immutable after creation.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              connectorRef:
                properties:
                  name:
                    type: string
                  uid:
                    type: string
                required:
                - name
                - uid
                type: object
              key:
                properties:
                  id:
                    description: ID is a client-selected, DNS-label identifier for
                      this key.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  proof:
                    description: |-
                      Proof is an unpadded base64url RSA-PSS/SHA-256 signature over the canonical
                      enrollment statement documented by the Connect API.
                    maxLength: 2048
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: proof is immutable for an enrolled key
                      rule: oldSelf == null || self == oldSelf
                  publicKey:
                    description: |-
                      PublicKey is a PEM encoded RSA public key. The matching private key remains
                      on the Connector and signs both enrollment proofs and OAuth JWT assertions.
                    maxLength: 8192
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: publicKey is immutable in an enrollment
                      rule: oldSelf == null || self == oldSelf
                  state:
                    description: |-
                      State must be Active for the initial enrollment key. Revocation and
                      rotation occur through a protected platform operation, not Connector edits.
                    enum:
                    - Active
                    type: string
                required:
                - id
                - proof
                - publicKey
                - state
                type: object
            required:
            - connectorRef
            - key
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: enrollment spec is immutable; use the protected platform rotation
            or recovery API
          rule: oldSelf == null || self.spec == oldSelf.spec
    served: true
    storage: true
    subresources:
      status: {}
