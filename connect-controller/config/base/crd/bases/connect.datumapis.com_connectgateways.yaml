---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    discovery.miloapis.com/parent-contexts: Project
  name: connectgateways.connect.datumapis.com
spec:
  group: connect.datumapis.com
  names:
    kind: ConnectGateway
    listKind: ConnectGatewayList
    plural: connectgateways
    singular: connectgateway
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.gatewayClassRef
      name: Class
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ConnectGateway runs a managed gateway in a project VPC. Project Connectors
          attach through ConnectNetworkBinding resources.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              gatewayClassRef:
                description: GatewayClassRef names a cluster-scoped ConnectGatewayClass
                  in this project.
                type: string
              locationRef:
                description: LocationRef is the fully qualified Compute Location name
                  (for example, us-central-1).
                type: string
              networkRef:
                type: string
              peerRouting:
                description: |-
                  PeerRouting allows Connectors attached to this gateway to route directly
                  to the assigned addresses of the other attached Connectors. It is disabled
                  by default; VPC routes remain available regardless of this setting.
                type: boolean
              relayURLs:
                description: RelayURLs pins the gateway to operator-managed iroh relays
                  when set.
                items:
                  type: string
                type: array
              routes:
                items:
                  type: string
                maxItems: 32
                minItems: 1
                type: array
            required:
            - gatewayClassRef
            - locationRef
            - networkRef
            - routes
            type: object
          status:
            properties:
              classRef:
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              endpointID:
                type: string
              idleSince:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: |-
                  Phase summarizes this gateway's operational state without exposing the
                  underlying Compute implementation.
                enum:
                - Dormant
                - Provisioning
                - Available
                - Scaling
                type: string
              workloadRef:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
