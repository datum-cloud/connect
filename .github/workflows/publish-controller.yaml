name: Publish Connect Controller

on:
  push:
    branches: ["**"]

jobs:
  publish-controller-image:
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.21.0
    with:
      image-name: connect-controller
      context: connect-controller
      dockerfile-path: connect-controller/Dockerfile
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  publish-kustomize-bundle:
    needs: [publish-controller-image]
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@v1.21.0
    with:
      bundle-name: ghcr.io/datum-cloud/connect-kustomize
      bundle-path: connect-controller/config
      images: |
        - { path: connect-controller/config/base/manager, name: ghcr.io/datum-cloud/connect-controller, tag: "${{ needs.publish-controller-image.outputs.tag }}" }
    secrets: inherit
