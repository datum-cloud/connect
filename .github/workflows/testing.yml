name: testing

on:
  push:
    paths:
      - 'connect-plugin/**/*.go'
      - 'connect-plugin/go.mod'
      - 'connect-plugin/go.sum'
      - 'connect-lib/**'
      - '.github/workflows/testing.yml'

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all --check
        working-directory: connect-lib
      # The workspace denies clippy::unwrap_used, expect_used, panic and
      # indexing_slicing (see connect-lib/Cargo.toml). This step is the gate
      # that keeps production code panic-free.
      - name: Clippy
        run: cargo clippy --workspace --all-targets
        working-directory: connect-lib
      - name: Test
        run: cargo test --workspace
        working-directory: connect-lib

  testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: connect-plugin/go.mod
      - name: Verify dependencies
        run: go mod verify
        working-directory: connect-plugin
      - name: Build
        run: go build ./...
        working-directory: connect-plugin
      - name: Test (known-good packages only)
        run: go test -timeout 5m ./internal/daemon ./internal/env ./internal/exec ./internal/pidfile ./internal/state ./internal/svcconfig
        working-directory: connect-plugin
