name: testing

on:
  push:
    paths:
      - 'connect-plugin/**/*.go'
      - 'connect-plugin/go.mod'
      - 'connect-plugin/go.sum'
      - 'connect-lib/**/*.rs'
      - 'connect-lib/**/Cargo.toml'
      - 'connect-lib/Cargo.lock'
      - 'connect-lib/rust-toolchain.toml'
      - '.github/workflows/testing.yml'
  pull_request:
    paths:
      - 'connect-plugin/**/*.go'
      - 'connect-plugin/go.mod'
      - 'connect-plugin/go.sum'
      - 'connect-lib/**/*.rs'
      - 'connect-lib/**/Cargo.toml'
      - 'connect-lib/Cargo.lock'
      - 'connect-lib/rust-toolchain.toml'
      - '.github/workflows/testing.yml'

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Checkout datumctl dependency
        uses: actions/checkout@v6
        with:
          repository: datum-cloud/datumctl
          ref: v0.15.0
          path: datumctl-dep
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: connect-plugin/go.mod
      - name: Rewrite datumctl replace for CI
        run: go mod edit -replace go.datum.net/datumctl=../datumctl-dep
        working-directory: connect-plugin
      - name: Verify dependencies
        run: go mod verify
        working-directory: connect-plugin
      - name: Build
        run: go build ./...
        working-directory: connect-plugin
      - name: Test (known-good packages only)
        run: go test -timeout 5m ./internal/daemon ./internal/env ./internal/exec ./internal/pidfile ./internal/state ./internal/svcconfig
        working-directory: connect-plugin

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connect-lib
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
