name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  rust-cross:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            name: linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-amd64.exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            name: windows-arm64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}
      - name: Install native Linux TLS build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Build Rust binary
        env:
          DATUM_CONNECT_RELEASE_VERSION: ${{ github.ref_name }}
        run: cargo build --locked --release -p datum-connect-daemon -p datum-connect-network-helper --target ${{ matrix.target }}
        working-directory: connect-lib
      - name: Rename binary with platform suffix
        run: |
          mkdir -p dist/rust-bin
          cp connect-lib/target/${{ matrix.target }}/release/datum-connectd${{ contains(matrix.target, 'windows') && '.exe' || '' }} \
            dist/rust-bin/datum-connectd-${{ matrix.name }}
          if [[ '${{ matrix.target }}' != *windows* ]]; then
            cp connect-lib/target/${{ matrix.target }}/release/datum-connect-network-helper dist/rust-bin/datum-connect-network-helper-${{ matrix.name }}
          fi
        shell: bash
      - name: Upload Rust binary
        uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.name }}
          path: dist/rust-bin/*

  goreleaser:
    needs: rust-cross
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connect-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: connect-plugin/go.mod
      - name: Verify CLI and installer before publishing
        run: go test ./...
      - name: Download all Rust binaries
        uses: actions/download-artifact@v4
        with:
          path: /tmp/rust-artifacts
      - name: Stage Rust binaries for goreleaser
        run: |
          mkdir -p ../dist/rust
          find /tmp/rust-artifacts -type f -exec cp {} ../dist/rust/ \;
          for platform in linux darwin windows; do
            for arch in amd64 arm64; do
              suffix=""
              if [ "$platform" = windows ]; then suffix=".exe"; fi
              mkdir -p "../dist/rust/$platform-$arch"
              cp "../dist/rust/datum-connectd-$platform-$arch$suffix" "../dist/rust/$platform-$arch/datum-connectd$suffix"
              if [ "$platform" != windows ]; then
                chmod 755 "../dist/rust/$platform-$arch/datum-connectd"
                cp "../dist/rust/datum-connect-network-helper-$platform-$arch" "../dist/rust/$platform-$arch/datum-connect-network-helper"
                chmod 755 "../dist/rust/$platform-$arch/datum-connect-network-helper"
              fi
            done
          done
      - name: Install Syft CLI
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Stage pinned official signed Windows drivers and licenses
        run: |
          python3 ../scripts/stage-wintun.py --arch amd64 --destination ../dist/wintun-amd64
          python3 ../scripts/stage-wintun.py --arch arm64 --destination ../dist/wintun-arm64
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
          workdir: connect-plugin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
