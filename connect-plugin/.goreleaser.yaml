# GoReleaser config for the datumctl-connect plugin.
#
# Release a version by pushing a semver tag (vX.Y.Z). The workflow runs
# goreleaser, which builds the plugin and publishes archives + checksums.txt
# to a GitHub release. Manual PATH installation and trust are documented in INSTALL.txt.
#
# Each archive bundles the Go plugin binary (datumctl-connect) and the
# Rust daemon (datum-connect-daemon). The daemon is cross-compiled in the workflow and
# placed at ../dist/rust/ before goreleaser runs.
#
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: datumctl-connect

# This branch ships previews. Never move the production "latest" pointer.
release:
  draft: true
  prerelease: auto
  make_latest: false
  header: |
    This is the headless Connect preview. It makes breaking CLI changes.
    Each platform archive contains both datumctl-connect and datum-connect-daemon.
    Read INSTALL.txt for manual plugin installation, trust, and first-run setup.
    Checksums are not publisher signatures. macOS notarization is not included.
  extra_files:
    - glob: ../docs/INSTALL.txt

before:
  hooks:
    - go mod tidy

builds:
  - id: datumctl-connect
    main: .
    binary: datumctl-connect
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - "-X main.version=v{{.Version}}"

archives:
  - id: datumctl-connect
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - src: ../docs/INSTALL.txt
        dst: .
        strip_parent: true
      - src: ../LICENSE
        dst: .
        strip_parent: true
      - src: ../dist/rust/{{ .Os }}-{{ .Arch }}/datum-connect-daemon{{ if eq .Os "windows" }}.exe{{ end }}
        dst: .
        strip_parent: true
      - src: '{{ if ne .Os "windows" }}../dist/rust/{{ .Os }}-{{ .Arch }}/datum-connect-network-helper{{ else }}__no_network_helper_files__*{{ end }}'
        dst: .
        strip_parent: true
      - src: '{{ if eq .Os "windows" }}../dist/wintun-{{ .Arch }}/wintun.dll{{ else }}__no_wintun_files__*{{ end }}'
        dst: .
        strip_parent: true
      - src: '{{ if eq .Os "windows" }}../dist/wintun-{{ .Arch }}/WINTUN-LICENSE.txt{{ else }}__no_wintun_files__*{{ end }}'
        dst: .
        strip_parent: true

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
