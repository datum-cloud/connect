# GoReleaser config for the datumctl-connect plugin.
#
# Release a version by pushing a semver tag (vX.Y.Z). The workflow runs
# goreleaser, which builds the plugin and publishes archives + checksums.txt
# to a GitHub release. Manual PATH installation and trust are documented in INSTALL.txt.
#
# Each archive bundles the Go plugin binary (datumctl-connect) and the
# Rust daemon (datum-connectd). The daemon is cross-compiled in the workflow and
# placed at ../dist/rust/ before goreleaser runs.
#
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: datumctl-connect

# This branch ships previews. Never move the production "latest" pointer.
release:
  draft: true
  prerelease: auto
  make_latest: false
  header: |
    This is the headless Connect preview. It makes breaking CLI changes.
    Each platform archive contains both datumctl-connect and datum-connectd.
    With datumctl already installed, install this preview on macOS or Linux:

    ```sh
    bash -c 'set -e; v={{ .Tag }}; os=$(uname -s); case "$os" in Darwin|Linux) ;; *) echo "unsupported OS: $os" >&2; exit 1;; esac; arch=$(uname -m); case "$arch" in x86_64|amd64) arch=x86_64;; arm64|aarch64) arch=arm64;; *) echo "unsupported architecture: $arch" >&2; exit 1;; esac; asset="datumctl-connect_${os}_${arch}.tar.gz"; mkdir -p "$HOME/.local/bin"; curl -fsSL "https://github.com/datum-cloud/connect/releases/download/$v/$asset" | tar -xz -C "$HOME/.local/bin" datumctl-connect datum-connectd datum-connect-network-helper; export PATH="$HOME/.local/bin:$PATH"; datumctl plugin trust connect; datumctl connect version'
    ```

    Add `~/.local/bin` to `PATH` in your shell startup file if needed. Read
    INSTALL.txt for the detailed manual flow and troubleshooting.
    Section 7 of INSTALL.txt covers joining a managed VPC and reaching a running
    Compute instance by its VPC address. Join creates a ConnectGateway in the
    nearest location when the Network does not already have one.
    Checksums are not publisher signatures. macOS notarization is not included.
  extra_files:
    - glob: ../docs/INSTALL.txt

before:
  hooks:
    - go mod tidy

builds:
  - id: datumctl-connect
    main: .
    binary: datumctl-connect
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - "-X main.version=v{{.Version}}"

archives:
  - id: datumctl-connect
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - src: ../docs/INSTALL.txt
        dst: .
        strip_parent: true
      - src: ../LICENSE
        dst: .
        strip_parent: true
      - src: ../dist/rust/{{ .Os }}-{{ .Arch }}/datum-connectd{{ if eq .Os "windows" }}.exe{{ end }}
        dst: .
        strip_parent: true
      - src: '{{ if ne .Os "windows" }}../dist/rust/{{ .Os }}-{{ .Arch }}/datum-connect-network-helper{{ else }}__no_network_helper_files__*{{ end }}'
        dst: .
        strip_parent: true
      - src: '{{ if eq .Os "windows" }}../dist/wintun-{{ .Arch }}/wintun.dll{{ else }}__no_wintun_files__*{{ end }}'
        dst: .
        strip_parent: true
      - src: '{{ if eq .Os "windows" }}../dist/wintun-{{ .Arch }}/WINTUN-LICENSE.txt{{ else }}__no_wintun_files__*{{ end }}'
        dst: .
        strip_parent: true

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
