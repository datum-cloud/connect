# GoReleaser config for the datumctl-connect plugin.
#
# Release a version by pushing a prerelease tag (vX.Y.Z-dev.N), following the
# -dev.N pattern used by the other datumctl plugins. The workflow runs
# goreleaser, which builds the plugin and publishes archives + checksums.txt
# to a GitHub release. Installable via `datumctl plugin install datum-cloud/connect`.
#
# Each archive bundles both the Go plugin binary (datumctl-connect) and the
# Rust tunnel agent binary (datum-connect). The Rust binary is cross-compiled
# in the workflow and staged at release-assets/ before goreleaser runs.
#
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: datumctl-connect

before:
  hooks:
    - go mod tidy

builds:
  - id: datumctl-connect
    main: .
    binary: datumctl-connect
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - "-X main.version=v{{.Version}}"

archives:
  - id: datumctl-connect
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - src: release-assets/datum-connect-{{ .Os }}-{{ .Arch }}{{ if eq .Os "windows" }}.exe{{ end }}
        dst: datum-connect{{ if eq .Os "windows" }}.exe{{ end }}

release:
  # Until a real GA (plain vX.Y.Z) tag exists, every dev tag (v0.0.0-dev.N)
  # publishes as the latest release, not a prerelease — otherwise
  # `datumctl plugin install datum-cloud/connect` (no pinned version) has
  # nothing non-prerelease to resolve "latest" to and fails outright, since
  # GitHub's /releases/latest only ever considers non-prerelease releases.
  # Revisit this once dev/GA channels need to diverge again.
  prerelease: false
  make_latest: true

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
